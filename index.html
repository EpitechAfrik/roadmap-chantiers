<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chantiers digitaux AEIG</title>
<meta name="description" content="Pilotage des chantiers digitaux AEIG : sprint en cours, gros sujets et deadlines, backlog.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F1E3D'/%3E%3Cpath d='M9 22V10h3v12zm5.5 0V14h3v8zm5.5 0v-5h3v5z' fill='%23F59E0B'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light;
  --navy: #0f1e3d; --amber: #f59e0b; --amber-soft: #fef3c7;
  --bg: #f5f6f8; --surface: #ffffff; --surface-2: #f0f2f5; --border: #e3e6eb;
  --text: #0f172a; --text-2: #475569; --muted: #8a94a6;
  --fait: #12a26b; --fait-bg: #e3f6ee;
  --cours: #2a78d6; --cours-bg: #e4effc;
  --venir: #7a8496; --venir-bg: #eef0f3;
  --bloque: #d93b3b; --bloque-bg: #fdecec;
  --warn: #b45309; --warn-bg: #fdf3e1;
  --attente: #7c5cc4; --attente-bg: #f0ebfa;
  --shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 2px 8px rgba(15, 23, 42, .04);
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0b1222; --surface: #121b2e; --surface-2: #1a2438; --border: #243049;
    --text: #eef2f8; --text-2: #b4bdcc; --muted: #7d889c;
    --fait: #34c48b; --fait-bg: #12322a; --cours: #5aa0f0; --cours-bg: #142a47;
    --venir: #9aa3b3; --venir-bg: #1f2a3d; --bloque: #f07070; --bloque-bg: #3a1d22;
    --warn: #e3a548; --warn-bg: #3a2c14; --attente: #a98ef0; --attente-bg: #2a2142;
    --amber-soft: #3a2c14; --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0b1222; --surface: #121b2e; --surface-2: #1a2438; --border: #243049;
  --text: #eef2f8; --text-2: #b4bdcc; --muted: #7d889c;
  --fait: #34c48b; --fait-bg: #12322a; --cours: #5aa0f0; --cours-bg: #142a47;
  --venir: #9aa3b3; --venir-bg: #1f2a3d; --bloque: #f07070; --bloque-bg: #3a1d22;
  --warn: #e3a548; --warn-bg: #3a2c14; --attente: #a98ef0; --attente-bg: #2a2142;
  --amber-soft: #3a2c14; --shadow: none;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 70px; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 24px; }
@media (max-width: 600px) { .wrap { padding: 0 16px; } }

/* ---------- en-tête : le sprint en cours ---------- */
.hero { background: var(--navy); color: #fff; padding: 36px 0 30px; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -140px; top: -180px; width: 480px; height: 480px; border-radius: 50%; background: radial-gradient(circle, rgba(245,158,11,.20), rgba(245,158,11,0) 70%); pointer-events: none; }
.hero .wrap { position: relative; z-index: 1; }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--amber); }
.eyebrow::before { content: ""; width: 18px; height: 2px; background: var(--amber); border-radius: 2px; }
.hero-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 32px; align-items: end; margin-top: 10px; }
@media (max-width: 860px) { .hero-grid { grid-template-columns: 1fr; gap: 22px; } }
.hero h1 { font-size: clamp(30px, 4.4vw, 46px); line-height: 1.05; margin: 0; font-weight: 800; letter-spacing: -.02em; }
.hero h1 small { display: block; font-size: 15px; font-weight: 600; color: #94a3c4; letter-spacing: 0; margin-top: 8px; }
.goal { margin-top: 16px; font-size: 18px; color: #e6ebf5; max-width: 620px; }
.goal.empty { color: #94a3c4; font-style: italic; font-size: 15px; }
.kpis { display: flex; gap: 22px; margin-top: 18px; flex-wrap: wrap; }
.kpis div { font-size: 13px; color: #c7d0e3; }
.kpis b { display: block; font-size: 24px; color: #fff; font-weight: 800; font-variant-numeric: tabular-nums; }
.loadbox { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.10); border-radius: 14px; padding: 16px 18px; }
.loadbox h3 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #94a3c4; }
.lrow { display: grid; grid-template-columns: 90px 1fr 92px; gap: 10px; align-items: center; margin: 7px 0; font-size: 13.5px; }
.lbar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.10); overflow: hidden; }
.lbar span { display: block; height: 100%; border-radius: 99px; background: var(--amber); }
.lbar.over span { background: #f87171; }
.lrow .v { text-align: right; color: #c7d0e3; font-variant-numeric: tabular-nums; font-size: 12.5px; }
.lrow .v.over { color: #fca5a5; font-weight: 700; }
.loadbox .note { font-size: 12px; color: #94a3c4; margin-top: 8px; }

/* ---------- navigation ---------- */
.bar { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--border); }
.bar .wrap { display: flex; align-items: center; gap: 12px; padding-top: 10px; padding-bottom: 10px; flex-wrap: wrap; }
.tabs { display: flex; gap: 2px; flex-wrap: wrap; }
.tabs a { text-decoration: none; color: var(--text-2); font-weight: 600; font-size: 14px; padding: 7px 11px; border-radius: 9px; }
.tabs a:hover { background: var(--surface-2); color: var(--text); }
.ctabs { display: flex; gap: 4px; }
.ctabs button { border: 0; background: none; font: inherit; font-size: 15px; font-weight: 700; color: var(--text-2); padding: 8px 14px; border-radius: 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.ctabs button:hover { background: var(--surface-2); color: var(--text); }
.ctabs button.on { background: var(--navy); color: #fff; }
.ctabs .n { font-size: 11.5px; font-weight: 700; border-radius: 99px; padding: 1px 7px; background: var(--surface-2); color: var(--text-2); }
.ctabs button.on .n { background: rgba(255,255,255,.16); color: #fff; }
@media (max-width: 640px) { #anchors { display: none; } .ctabs button { font-size: 14px; padding: 7px 11px; } }
.lbar { position: relative; }
.lbar span.all { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(255,255,255,.22); }
.lbar span.mine { position: absolute; left: 0; top: 0; bottom: 0; }
.spacer { flex: 1; }
.seg { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; font: inherit; font-size: 13px; font-weight: 600; color: var(--text-2); padding: 5px 11px; border-radius: 7px; cursor: pointer; }
.seg button.on { background: var(--navy); color: #fff; }

/* ---------- sections ---------- */
main { padding: 30px 0 60px; }
section.blk { margin-bottom: 46px; }
.sh { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.sh h2 { font-size: 24px; margin: 0; font-weight: 800; letter-spacing: -.015em; }
.sh .meta { color: var(--muted); font-size: 13.5px; font-weight: 600; }
.sh p { flex-basis: 100%; margin: 0; color: var(--text-2); font-size: 14px; }

.board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; align-items: start; }
@media (max-width: 900px) { .board { grid-template-columns: 1fr; } }
.col { background: var(--surface-2); border-radius: var(--radius); padding: 10px; }
.col-head { display: flex; align-items: center; gap: 8px; padding: 4px 6px 10px; font-weight: 700; font-size: 14px; }
.col-head .ic { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; }
.col-head .cnt { margin-left: auto; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.col.done .card { opacity: .78; }
.col .empty { color: var(--muted); font-size: 13px; padding: 4px 8px 8px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 11px; padding: 11px 13px; margin-bottom: 8px; box-shadow: var(--shadow); }
.card:last-child { margin-bottom: 0; }
.card h4 { margin: 0 0 6px; font-size: 14.5px; font-weight: 650; line-height: 1.35; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.tag { font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 99px; background: var(--surface-2); color: var(--text-2); white-space: nowrap; }
.tag.ch { background: transparent; border: 1px solid var(--border); }
.tag.warn { background: var(--warn-bg); color: var(--warn); }
.tag.att { background: var(--attente-bg); color: var(--attente); }
.tag.blk { background: var(--bloque-bg); color: var(--bloque); }
.tag.ok { background: var(--fait-bg); color: var(--fait); }
.tag.cours { background: var(--cours-bg); color: var(--cours); }
.who { margin-top: 7px; display: flex; justify-content: space-between; font-size: 12.5px; color: var(--text-2); }
.who b { color: var(--text); font-weight: 600; }

.incidents { margin-top: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
.incidents h3 { margin: 0 0 8px; font-size: 14px; display: flex; gap: 8px; align-items: center; }
.inc { display: flex; gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--surface-2); font-size: 13.5px; flex-wrap: wrap; }
.inc:first-of-type { border-top: 0; }
.inc .t { flex: 1 1 260px; font-weight: 600; }
.inc .m { color: var(--muted); font-size: 12.5px; }

.next { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
.trow { display: flex; gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--surface-2); font-size: 13.5px; flex-wrap: wrap; }
.trow:first-child { border-top: 0; }
.trow .t { flex: 1 1 260px; }
.trow .e { color: var(--muted); font-size: 12.5px; }
.trow .d { font-variant-numeric: tabular-nums; color: var(--text-2); font-size: 12.5px; white-space: nowrap; }

.epics { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
.epic { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 15px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; }
.epic.hot { border-color: color-mix(in srgb, var(--amber) 55%, var(--border)); }
.epic h4 { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.3; }
.epic .desc { font-size: 13px; color: var(--text-2); }
.epic .who { margin-top: 0; }
.prog { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.prog span { display: block; height: 100%; background: var(--fait); border-radius: 99px; }
.dl { font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.dl.late { color: var(--bloque); }
.dl.soon { color: var(--warn); }
.dl.none { color: var(--muted); font-weight: 500; }
.subh { margin: 22px 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; }

.backlog { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 6px 16px 12px; box-shadow: var(--shadow); }
.bl-g { padding-top: 10px; }
.bl-g h4 { margin: 0 0 2px; font-size: 13.5px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ideas { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
.ideas span { background: var(--surface-2); border: 1px solid var(--border); border-radius: 99px; padding: 4px 11px; font-size: 13px; }

table.hist { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; font-size: 13.5px; }
table.hist th, table.hist td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--surface-2); }
table.hist th { color: var(--muted); font-weight: 600; font-size: 12px; }
table.hist td.n { font-variant-numeric: tabular-nums; }

details.wins { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; }
details.wins summary { cursor: pointer; font-weight: 600; font-size: 14.5px; list-style: none; display: flex; gap: 10px; align-items: center; }
details.wins summary::-webkit-details-marker { display: none; }
details.wins summary::before { content: "›"; transition: transform .15s; font-size: 18px; line-height: 1; color: var(--muted); }
details.wins[open] summary::before { transform: rotate(90deg); }
.wins-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 4px 20px; margin-top: 12px; }
.wins-grid h5 { grid-column: 1 / -1; margin: 10px 0 2px; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.wins-grid div { font-size: 13px; color: var(--text-2); padding: 2px 0; }
.wins-grid div::before { content: "✓ "; color: var(--fait); font-weight: 700; }

footer { border-top: 1px solid var(--border); padding: 20px 0 36px; color: var(--muted); font-size: 13px; }
.hidden { display: none !important; }
@media print { .bar { display: none; } .hero { print-color-adjust: exact; -webkit-print-color-adjust: exact; } .card, .epic { break-inside: avoid; } }
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <span class="eyebrow">Chantiers digitaux AEIG</span>
    <div class="hero-grid">
      <div>
        <h1 id="spName"></h1>
        <div class="goal" id="spGoal"></div>
        <div class="kpis" id="spKpis"></div>
      </div>
      <div class="loadbox" id="spLoad"></div>
    </div>
  </div>
</header>

<nav class="bar" aria-label="Navigation">
  <div class="wrap">
    <div class="ctabs" id="ctabs" role="tablist" aria-label="Chantiers"></div>
    <div class="spacer"></div>
    <div class="tabs" id="anchors">
      <a href="#sprint">Sprint</a><a href="#sujets">Gros sujets</a><a href="#backlog">Backlog</a><a href="#historique">Historique</a>
    </div>
  </div>
</nav>

<main class="wrap" id="main"></main>

<footer><div class="wrap" id="foot"></div></footer>

<script>
document.write('<script src="sprints.js?v=' + Date.now() + '"><\/script><script src="data.js?v=' + Date.now() + '"><\/script>');
</script>
<script>
const S = window.SPRINTS, R = window.ROADMAP;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const days = n => n == null ? 'à estimer' : String(+n).replace('.', ',') + ' j';
const sum = (l, f) => l.reduce((a, x) => a + (f(x) || 0), 0);
const dfmt = (d, o = { day: 'numeric', month: 'short' }) => new Date(d + 'T12:00').toLocaleDateString('fr-FR', o);
const CHANTIERS = ['Odoo', 'Zeno', 'Mydocs'];
let CH = CHANTIERS.find(c => c.toLowerCase() === (new URLSearchParams(location.search).get('chantier') || '').toLowerCase()) || 'Odoo';
const inCh = x => x.chantier === CH;

function deadline(d) {
  if (!d) return '<span class="dl none">Deadline à définir</span>';
  const n = Math.round((new Date(d + 'T12:00') - new Date()) / 86400000);
  return n < 0 ? `<span class="dl late">⚠ ${dfmt(d)} · dépassée</span>` : n <= 14 ? `<span class="dl soon">${dfmt(d)} · J-${n}</span>` : `<span class="dl">${dfmt(d)}</span>`;
}

function header() {
  const s = S.current;
  if (!s) { $('#spName').textContent = 'Pas de sprint en cours'; return; }
  $('#spName').innerHTML = `${esc(CH)} · Sprint ${esc(s.name.replace('S', ''))}<small>${dfmt(s.start, { weekday: 'long', day: 'numeric', month: 'long' })} → ${dfmt(s.end, { weekday: 'long', day: 'numeric', month: 'long' })}</small>`;
  $('#spGoal').className = 'goal' + (s.goal ? '' : ' empty');
  $('#spGoal').textContent = s.goal || 'Objectif du sprint à définir.';
  const ts = s.tasks.filter(inCh), incs = s.incidents.filter(inCh);
  $('#spKpis').innerHTML = [
    [ts.length, 'sous-sujets engagés'], [ts.filter(t => t.status === 'fait').length, 'livrés'],
    [incs.length, 'imprévus'], [ts.filter(t => t.carried_from).length, 'reportés'],
  ].map(([n, l]) => `<div><b>${n}</b>${l}</div>`).join('');
  // charge de chacun : la part de ce chantier (couleur) dans sa charge totale de la semaine (gris clair)
  const mine = {};
  ts.forEach(t => { const p = t.person || 'Non attribué'; mine[p] = (mine[p] || 0) + (t.estimate || 0); });
  incs.filter(i => i.decision === 'traite').forEach(i => { const p = i.person || 'Non attribué'; mine[p] = (mine[p] || 0) + (i.impact || 0); });
  const people = [...new Set([...Object.keys(s.capacity), ...Object.keys(s.load)])].filter(p => s.capacity[p] || s.load[p]);
  const n = v => String(+(v || 0).toFixed(1)).replace('.', ',');
  $('#spLoad').innerHTML = `<h3>Charge de la semaine · part ${esc(CH)}</h3>` + people.map(p => {
    const cap = s.capacity[p] || 0, all = s.load[p] || 0, m = mine[p] || 0, over = all > cap, w = v => Math.min(100, 100 * v / Math.max(cap, .5));
    return `<div class="lrow"><span>${esc(p)}</span><div class="lbar ${over ? 'over' : ''}"><span class="all" style="width:${w(all)}%"></span><span class="mine" style="width:${w(m)}%;background:${over ? '#f87171' : 'var(--amber)'}"></span></div><span class="v ${over ? 'over' : ''}">${n(m)} · ${n(all)} / ${n(cap)} j</span></div>`;
  }).join('') + `<div class="note">En couleur : ${esc(CH)} · en clair : charge totale de la semaine, tous chantiers. On ne s'engage pas sur plus que la capacité ; les imprévus traités comptent.</div>`;
}

function taskCard(t) {
  return `<div class="card"><h4>${esc(t.title)}</h4>
    <div class="tags">${t.epic ? `<span class="tag">${esc(t.epic)}</span>` : ''}${t.chantier ? `<span class="tag ch">${esc(t.chantier)}</span>` : ''}${t.carried_from ? `<span class="tag warn">reporté de ${esc(t.carried_from)}</span>` : ''}${t.from_incident ? '<span class="tag warn">imprévu</span>' : ''}</div>
    <div class="who"><span>${t.person ? `<b>${esc(t.person)}</b>` : 'Non attribué'}</span><span>${days(t.estimate)}</span></div></div>`;
}

function sprintSection() {
  const s = S.current;
  if (!s) return '';
  const ts = s.tasks.filter(inCh), incs = s.incidents.filter(inCh);
  const cols = [['a_faire', 'À faire', '○', 'var(--venir)', 'var(--venir-bg)'], ['en_cours', 'En cours', '◐', 'var(--cours)', 'var(--cours-bg)'], ['fait', 'Fait', '✓', 'var(--fait)', 'var(--fait-bg)']];
  const decision = i => i.decision === 'traite' ? '<span class="tag ok">Traité dans le sprint</span>' : i.decision === 'bascule' ? '<span class="tag cours">Basculé au sprint suivant</span>' : '<span class="tag warn">À qualifier</span>';
  return `<section class="blk" id="sprint">
    <div class="sh"><h2>Sprint en cours</h2><span class="meta">${ts.length} sous-sujet(s) · ${days(sum(ts, t => t.estimate))}</span></div>
    <div class="board">${cols.map(([k, l, ic, c, bg]) => {
      const list = ts.filter(t => t.status === k);
      return `<div class="col ${k === 'fait' ? 'done' : ''}"><div class="col-head"><span class="ic" style="color:${c};background:${bg}">${ic}</span>${l}<span class="cnt">${list.length}</span></div>${list.length ? list.map(taskCard).join('') : '<div class="empty">—</div>'}</div>`;
    }).join('')}</div>
    <div class="incidents"><h3>⚡ Imprévus du sprint <span class="tag">${incs.length}</span></h3>
      ${incs.length ? incs.map(i => `<div class="inc"><span class="t">${esc(i.title)}</span><span class="m">${[i.day && dfmt(i.day, { weekday: 'short', day: 'numeric' }), i.person, i.epic].filter(Boolean).map(esc).join(' · ')}</span><span class="m">${i.impact ? days(i.impact) : ''}</span>${decision(i)}</div>`).join('') : '<div class="m" style="color:var(--muted);font-size:13px">Aucun imprévu pour l\'instant.</div>'}
    </div></section>`;
}

function nextSection() {
  const n = S.next;
  if (!n) return `<section class="blk" id="suivant"><div class="sh"><h2>Sprint suivant</h2><p>Pas encore planifié.</p></div></section>`;
  const ts = n.tasks.filter(inCh);
  return `<section class="blk" id="suivant"><div class="sh"><h2>Sprint suivant · ${esc(n.name)}</h2><span class="meta">${dfmt(n.start)} → ${dfmt(n.end)} · ${ts.length} sous-sujet(s) · ${days(sum(ts, t => t.estimate))}</span>${n.goal ? `<p>${esc(n.goal)}</p>` : ''}</div>
    <div class="next">${ts.length ? ts.map(t => `<div class="trow"><span class="t">${esc(t.title)} ${t.carried_from ? `<span class="tag warn">reporté de ${esc(t.carried_from)}</span>` : ''}${t.from_incident ? '<span class="tag warn">imprévu</span>' : ''}</span><span class="e">${esc(t.epic || '')}</span><span class="d">${esc(t.person || '—')} · ${days(t.estimate)}</span></div>`).join('') : '<div class="trow" style="color:var(--muted)">Rien de planifié pour l\'instant.</div>'}</div></section>`;
}

function epicCard(e) {
  const pct = e.days_total ? 100 * e.days_done / e.days_total : (e.tasks_total ? 100 * e.tasks_done / e.tasks_total : 0);
  const st = { bloque: '<span class="tag blk">Bloqué</span>', en_attente: '<span class="tag att">En attente</span>', a_venir: '<span class="tag">À venir</span>' }[e.status] || '';
  return `<div class="epic ${e.in_sprint ? 'hot' : ''}">
    <div class="tags"><span class="tag ch">${esc(e.chantier)}</span>${st}${e.in_sprint ? '<span class="tag cours">Dans le sprint</span>' : ''}<span class="spacer"></span>${deadline(e.deadline)}</div>
    <h4>${esc(e.name)}</h4>
    ${e.description ? `<div class="desc">${esc(e.description)}</div>` : ''}
    ${e.tasks_total ? `<div class="prog"><span style="width:${pct}%"></span></div><div class="who"><span>${e.tasks_done}/${e.tasks_total} sous-sujets faits</span><span>${e.days_total ? `${String(e.days_done).replace('.', ',')} / ${days(e.days_total)}` : ''}</span></div>` : ''}
    ${e.owner || e.contact ? `<div class="who"><span>${e.owner ? `Porteur <b>${esc(e.owner)}</b>` : ''}</span><span>${esc(e.contact || '')}</span></div>` : ''}
  </div>`;
}

function epicsSection() {
  const all = S.epics.filter(inCh);
  const active = all.filter(e => e.status === 'actif').sort((a, b) => (b.in_sprint - a.in_sprint) || (a.deadline || '9999').localeCompare(b.deadline || '9999'));
  const coming = all.filter(e => e.status === 'a_venir' || e.status === 'bloque').sort((a, b) => (a.status === 'bloque' ? -1 : 0) - (b.status === 'bloque' ? -1 : 0));
  const waiting = all.filter(e => e.status === 'en_attente');
  const g = (title, l) => l.length ? `<div class="subh">${title} · ${l.length}</div><div class="epics">${l.map(epicCard).join('')}</div>` : '';
  return `<section class="blk" id="sujets"><div class="sh"><h2>Gros sujets</h2><span class="meta">${all.length} sujet(s)</span><p>Les chantiers de fond, avec leur deadline. Ceux du sprint en cours sont surlignés.</p></div>
    ${g('Actifs', active)}${g('À venir et points d\'attention', coming)}${g('En attente', waiting)}</section>`;
}

function backlogSection() {
  const bl = S.backlog.filter(inCh);
  const groups = [...new Set(bl.map(t => t.epic))].map(name => ({ name, list: bl.filter(t => t.epic === name) }));
  const ideas = (R && R.ideas && CH === 'Zeno') ? R.ideas.items : [];
  return `<section class="blk" id="backlog"><div class="sh"><h2>Backlog</h2><span class="meta">${bl.length} sous-sujet(s) · ${days(sum(bl, t => t.estimate))} estimés</span><p>Ce qui attend d'être planifié dans un sprint, par gros sujet.</p></div>
    <div class="backlog">${groups.map(g => `<div class="bl-g"><h4>${esc(g.name || 'Sans gros sujet')} ${g.list[0].chantier ? `<span class="tag ch">${esc(g.list[0].chantier)}</span>` : ''}</h4>
      ${g.list.map(t => `<div class="trow"><span class="t">${esc(t.title)}${t.carried_from ? ` <span class="tag warn">revenu de ${esc(t.carried_from)}</span>` : ''}${t.priority === 1 ? ' <span class="tag blk">Prioritaire</span>' : ''}</span><span class="d">${esc(t.person || '—')} · ${days(t.estimate)}</span></div>`).join('')}</div>`).join('') || '<div class="trow" style="color:var(--muted)">Backlog vide.</div>'}
      ${ideas.length ? `<div class="bl-g"><h4>${esc(R.ideas.title)}</h4><div class="ideas">${ideas.map(x => `<span>${esc(x)}</span>`).join('')}</div></div>` : ''}
    </div></section>`;
}

function historySection() {
  const wins = R ? R.chantiers.map(c => ({ name: c.name, items: c.items.filter(i => i.status === 'fait') })).filter(c => c.items.length && c.name === CH) : [];
  const nWins = sum(wins, c => c.items.length);
  const h = S.history;
  return `<section class="blk" id="historique"><div class="sh"><h2>Historique</h2><p>Bilans des sprints clôturés (tous chantiers).</p></div>
    ${h.length ? `<table class="hist"><thead><tr><th>Sprint</th><th>Livrés</th><th>Engagé → livré</th><th>Imprévus</th><th>Reportés</th></tr></thead><tbody>${h.map(s => { const r = s.review || {}; return `<tr><td><b>${esc(s.name)}</b> <span style="color:var(--muted)">${dfmt(s.start)}</span></td><td class="n">${r.tasks_done ?? '—'}</td><td class="n">${days(r.engaged_days)} → ${days(r.done_days)}</td><td class="n">${r.incidents ?? 0} (${days(r.incident_days || 0)})</td><td class="n">${r.carried ?? 0} basculé(s), ${r.back_to_backlog ?? 0} au backlog</td></tr>`; }).join('')}</tbody></table>`
      : '<p style="color:var(--muted);font-size:14px;margin:0 0 14px">Le bilan de chaque sprint clôturé apparaîtra ici.</p>'}
    <div style="height:14px"></div>
    <details class="wins"><summary>🏆 ${nWins} réalisation(s) ${esc(CH)} déjà livrée(s) <span style="color:var(--muted);font-weight:500;font-size:13px">— afficher</span></summary>
      <div class="wins-grid">${wins.map(c => `<h5>${esc(c.name)}</h5>${c.items.map(i => `<div>${esc(i.title)}</div>`).join('')}`).join('')}</div>
    </details></section>`;
}

function tabs() {
  const live = c => S.epics.filter(e => e.chantier === c && e.status === 'actif').length;
  $('#ctabs').innerHTML = CHANTIERS.map(c => `<button role="tab" aria-selected="${c === CH}" class="${c === CH ? 'on' : ''}" data-c="${c}">${c}<span class="n" title="gros sujets actifs">${live(c)}</span></button>`).join('');
  $('#ctabs').querySelectorAll('button').forEach(b => b.onclick = () => {
    CH = b.dataset.c;
    history.replaceState(null, '', '?chantier=' + CH.toLowerCase());
    render(); window.scrollTo({ top: 0 });
  });
}
function render() {
  document.title = CH + ' · Chantiers digitaux AEIG';
  tabs(); header();
  $('#main').innerHTML = sprintSection() + nextSection() + epicsSection() + backlogSection() + historySection();
}
render();
$('#foot').textContent = 'Mis à jour le ' + dfmt(S.updated, { day: 'numeric', month: 'long', year: 'numeric' }) + ' · sprints d\'une semaine, charge estimée en jours.';

</script>
</body>
</html>
